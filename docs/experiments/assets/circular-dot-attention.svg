<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 298" role="img" aria-label="Four-panel storyboard showing a dot moving in a circle, with gaze controlled by a Gaussian precision field and observations becoming sparse then increasing after a perturbation"><rect width="880" height="298" rx="16" fill="#0e1726"/><text x="24" y="28" fill="#f3f5fa" font-family="sans-serif" font-size="17" font-weight="bold">Active vision: learn → predict → verify → adapt</text><rect x="16" y="44" width="207" height="235" rx="12" fill="#17263a" stroke="#30445b"/><text x="28" y="69" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">1  Learn</text><text x="28" y="88" fill="#afc2d6" font-family="sans-serif" font-size="11">Frequent observations</text><ellipse cx="123" cy="143" rx="70" ry="57" fill="none" stroke="#8293a8" stroke-dasharray="5 5" stroke-width="1.5"/><circle cx="123" cy="86" r="34" fill="#60a5fa" opacity=".10"/><circle cx="123" cy="86" r="20" fill="none" stroke="#60a5fa" opacity=".4"/><circle cx="123" cy="86" r="10" fill="none" stroke="#60a5fa" stroke-width="2"/><path d="M118 86h10 M123 81v10" stroke="#60a5fa" stroke-width="1.5"/><circle cx="123" cy="86" r="5.5" fill="#fbbf24" stroke="#fff" stroke-width="1"/><text x="28" y="238" fill="#cbd5e1" font-family="sans-serif" font-size="11">Samples over time</text><path d="M28 254 H210" stroke="#71859a" stroke-width="1"/><path d="M37 248v12" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><path d="M86 248v12" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><path d="M135 248v12" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><path d="M184 248v12" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><text x="28" y="273" fill="#8ca5bc" font-family="sans-serif" font-size="9">blue = gaze/precision  ·  gold = dot</text><rect x="233" y="44" width="207" height="235" rx="12" fill="#17263a" stroke="#30445b"/><text x="245" y="69" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">2  Predict</text><text x="245" y="88" fill="#afc2d6" font-family="sans-serif" font-size="11">Look ahead on the circle</text><ellipse cx="340" cy="143" rx="70" ry="57" fill="none" stroke="#8293a8" stroke-dasharray="5 5" stroke-width="1.5"/><circle cx="340" cy="200" r="24" fill="#60a5fa" opacity=".10"/><circle cx="340" cy="200" r="20" fill="none" stroke="#60a5fa" opacity=".4"/><circle cx="340" cy="200" r="10" fill="none" stroke="#60a5fa" stroke-width="2"/><path d="M335 200h10 M340 195v10" stroke="#60a5fa" stroke-width="1.5"/><circle cx="410" cy="143" r="5.5" fill="#fbbf24" stroke="#fff" stroke-width="1"/><text x="245" y="238" fill="#cbd5e1" font-family="sans-serif" font-size="11">Samples over time</text><path d="M245 254 H427" stroke="#71859a" stroke-width="1"/><path d="M254 248v12" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><path d="M303 248v12" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><text x="245" y="273" fill="#8ca5bc" font-family="sans-serif" font-size="9">blue = gaze/precision  ·  gold = dot</text><rect x="450" y="44" width="207" height="235" rx="12" fill="#17263a" stroke="#30445b"/><text x="462" y="69" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">3  Verify</text><text x="462" y="88" fill="#afc2d6" font-family="sans-serif" font-size="11">Sparse, targeted sampling</text><ellipse cx="557" cy="143" rx="70" ry="57" fill="none" stroke="#8293a8" stroke-dasharray="5 5" stroke-width="1.5"/><circle cx="557" cy="200" r="11" fill="#60a5fa" opacity=".10"/><circle cx="557" cy="200" r="20" fill="none" stroke="#60a5fa" opacity=".4"/><circle cx="557" cy="200" r="10" fill="none" stroke="#60a5fa" stroke-width="2"/><path d="M552 200h10 M557 195v10" stroke="#60a5fa" stroke-width="1.5"/><circle cx="557" cy="200" r="5.5" fill="#fbbf24" stroke="#fff" stroke-width="1"/><text x="462" y="238" fill="#cbd5e1" font-family="sans-serif" font-size="11">Samples over time</text><path d="M462 254 H644" stroke="#71859a" stroke