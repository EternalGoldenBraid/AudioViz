[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioviz"
version = "0.1.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "opencv-python>=4.12.0.88",
    "pillow>=12.1.1",
    "pyopengl>=3.1.9",
    "pyqt5>=5.15.11",
    "pyqtgraph>=0.14.0",
    "qdarkstyle>=3.2.3",
    "rich>=15.0.0",
    "sounddevice>=0.5.5",
    "textual>=0.80.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
